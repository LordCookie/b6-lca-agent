# Hüllen-Defaults nach Baujahr-Klassen (TABULA-orientiert).
# Werden vom Energie-Agent verwendet, wenn der Research-Agent
# keine besseren (verifizierten) Werte liefert.
#
# Felder pro Klasse:
#   u_wall, u_roof, u_floor, u_window  - U-Werte [W/(m²K)]
#   window_wall_ratio                  - Fensterflächenanteil an Fassade [-]
#   g_value                            - Gesamtenergiedurchlassgrad Verglasung [-]
#   shading_factor_F_S                 - Verschattung (Eigenverschattung etc.) [-]
#   frame_factor_F_F                   - Rahmenanteilfaktor [-]
#   uncertainty_rel                    - relative Unsicherheit der U-Werte (Gauß)

build_year_class_pre_1980:
  source: "TABULA DE.N.MFH.04 (Baujahr 1958-1978, unsaniert)"
  u_wall: 1.20
  u_roof: 0.80
  u_floor: 1.00
  u_window: 2.80
  window_wall_ratio: 0.25
  g_value: 0.75
  shading_factor_F_S: 0.7
  frame_factor_F_F: 0.7
  uncertainty_rel: 0.25

build_year_class_1980_2000:
  source: "TABULA DE.N.MFH.06 (Baujahr 1979-1994, WSchV 1977/1984)"
  u_wall: 0.55
  u_roof: 0.35
  u_floor: 0.55
  u_window: 2.10
  window_wall_ratio: 0.30
  g_value: 0.70
  shading_factor_F_S: 0.7
  frame_factor_F_F: 0.7
  uncertainty_rel: 0.20

build_year_class_2000_2015:
  source: "TABULA DE.N.MFH.08 (Baujahr 2002-2009, EnEV 2002/2009)"
  u_wall: 0.28
  u_roof: 0.20
  u_floor: 0.30
  u_window: 1.30
  window_wall_ratio: 0.35
  g_value: 0.60
  shading_factor_F_S: 0.7
  frame_factor_F_F: 0.7
  uncertainty_rel: 0.15

build_year_class_post_2015:
  source: "EnEV 2014 / GEG 2020 Referenzgebäude"
  u_wall: 0.20
  u_roof: 0.16
  u_floor: 0.24
  u_window: 1.10
  window_wall_ratio: 0.35
  g_value: 0.55
  shading_factor_F_S: 0.7
  frame_factor_F_F: 0.7
  uncertainty_rel: 0.15

# Default falls Baujahr unbekannt — bewusst konservativ (höhere Verluste).
default_class: build_year_class_1980_2000
